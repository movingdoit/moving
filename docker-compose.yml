version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: hainan-dashboard-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: hainan_dashboard
      MYSQL_USER: dashboard_user
      MYSQL_PASSWORD: dashboard_pass
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d
    command: 
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    networks:
      - hainan-dashboard-network

  # Redis缓存
  redis:
    image: redis:7.0-alpine
    container_name: hainan-dashboard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/etc/redis/redis.conf
    command: redis-server /etc/redis/redis.conf
    networks:
      - hainan-dashboard-network

  # 后端应用
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hainan-dashboard-backend:latest
    container_name: hainan-dashboard-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: hainan_dashboard
      DB_USERNAME: dashboard_user
      DB_PASSWORD: dashboard_pass
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
    depends_on:
      - mysql
      - redis
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    networks:
      - hainan-dashboard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端应用
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: hainan-dashboard-frontend:latest
    container_name: hainan-dashboard-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - nginx_logs:/var/log/nginx
    networks:
      - hainan-dashboard-network

  # Nginx (备用，如果前端容器不包含Nginx)
  nginx:
    image: nginx:1.24-alpine
    container_name: hainan-dashboard-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
    networks:
      - hainan-dashboard-network
    profiles:
      - nginx-separate

  # 监控：Prometheus (可选)
  prometheus:
    image: prom/prometheus:latest
    container_name: hainan-dashboard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - hainan-dashboard-network
    profiles:
      - monitoring

  # 监控：Grafana (可选)
  grafana:
    image: grafana/grafana:latest
    container_name: hainan-dashboard-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - hainan-dashboard-network
    profiles:
      - monitoring

# 数据卷定义
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# 网络定义
networks:
  hainan-dashboard-network:
    driver: bridge